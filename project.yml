name: PocketCode
options:
  bundleIdPrefix: com.vibecodeing.pocketcode
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
targets:
  PocketCode:
    type: application
    platform: iOS
    sources: 
      - PocketCode
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecodeing.pocketcode