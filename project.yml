name: PocketCode
options:
  bundleIdPrefix: com.vibecodeing
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
targets:
  PocketCode:
    type: application
    platform: iOS
    sources:
      - APP
      - Sandbox
      - UI
      - Tools
      - Agent
    settings:
      base:
        PRODUCT_NAME: PocketCode   # <--- 关键：显式指定产品名，避免 XcodeGen 乱拼接
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecodeing.pocketcode   # <--- 绝对唯一的 ID
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1