name: PocketCode
options:
  bundleIdPrefix: com.vibecodeing
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  PocketCode:
    type: application
    platform: iOS
    sources:
      - APP
      - Sandbox
      - UI
      - Tools
      - Agent
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: PocketCode
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecodeing.pocketcode
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1