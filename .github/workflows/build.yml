name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Force objectVersion to 56
      run: |
        sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' PocketCode.xcodeproj/project.pbxproj

    - name: Select Xcode 15.4
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Build App
      run: |
        xcodebuild build \
          -project PocketCode.xcodeproj \
          -scheme PocketCode \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r ./build/Build/Products/Release-iphoneos/PocketCode.app Payload/
        zip -r PocketCode.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: PocketCode-Unsigned-IPA
        path: PocketCode.ipa